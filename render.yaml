services:
  - type: web
    name: transit-allinone-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: BUSNEARBY_BASE_URL
        value: https://api.busnearby.co.il
